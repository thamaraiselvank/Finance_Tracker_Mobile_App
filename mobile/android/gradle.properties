org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Windows: project (F:) and pub cache (C:) are on different drives, which breaks
# Kotlin incremental caches ("Could not close incremental caches").
kotlin.incremental=false

# AGP 9 turns on R8 "strict full mode" for keep rules: a rule that keeps a
# class no longer keeps its no-argument constructor. ML Kit (and Firebase-style
# libraries) create their parts by reflection from such classes, so release
# builds crashed when reading a screenshot ("getClass() on a null object
# reference"). Use the AGP 8 behaviour for every library.
android.r8.strictFullModeForKeepRules=false
